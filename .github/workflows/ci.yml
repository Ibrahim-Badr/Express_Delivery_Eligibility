name: CI - Lint, Unit Tests & Docker Stack

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "release/**"
      - "hotfix/**"
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  quality-and-tests:
    name: Code Quality (Ruff + Pylint) & Pytest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Ruff linter
        run: python -m ruff check .

      - name: Run Pylint static analysis
        run: python -m pylint src/

      - name: Run Pytest suite
        run: python -m pytest -v

  docker-integration:
    name: Docker Compose End-to-End Test Stack
    needs: quality-and-tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Compose configurations
        run: |
          docker compose -f docker-compose.test.yml config -q
          docker compose -f docker-compose.prod.yml config -q

      - name: Run containerized test stack (Postgres + ERP + Trainer + Pytest)
        run: docker compose -f docker-compose.test.yml run --rm --build test-runner

      - name: Build production Airflow orchestrator image
        run: docker compose -f docker-compose.prod.yml build airflow

      - name: Teardown test containers and volumes
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
