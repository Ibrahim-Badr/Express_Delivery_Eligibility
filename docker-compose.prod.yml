services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL Production Database (24/7 Stateful ERP Store)
  # ----------------------------------------------------------------------------
  db:
    image: postgres:17-alpine
    container_name: express_delivery_db_prod
    environment:
      POSTGRES_DB: livraison_express
      POSTGRES_USER: livraison
      POSTGRES_PASSWORD: livraison
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - prod_postgres_data:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U livraison -d livraison_express"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # 2. ERP Simulator Service (Continuously feeds live order batches)
  # ----------------------------------------------------------------------------
  erp-simulator:
    build:
      context: ./erp
      dockerfile: Dockerfile
    container_name: express_delivery_erp_prod
    environment:
      POSTGRES_DSN: postgresql://livraison:livraison@db:5432/livraison_express
      BATCH_SIZE: 5
      INTERVAL_SECONDS: 5
      POSTGRES_HISTORY_ORDERS: 10000
      RECENT_HISTORY_ORDERS: 1000
      LIVE_ORDER_LIMIT: 0
      LOG_LEVEL: INFO
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/erp_seeded"]
      interval: 2s
      timeout: 2s
      retries: 30
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # 3. Initial Model Training Batch Job (Prepares initial model artifacts)
  # ----------------------------------------------------------------------------
  trainer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: express_delivery_trainer_prod
    command: ["python", "-m", "src.cli", "train"]
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://livraison:livraison@db:5432/livraison_express
      - ARTIFACTS_DIR=/app/artifacts
    volumes:
      - prod_model_artifacts:/app/artifacts
    depends_on:
      db:
        condition: service_healthy
      erp-simulator:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    restart: "no"

  # ----------------------------------------------------------------------------
  # 4. FastAPI Serving Service (Stateless REST API for real-time predictions)
  # ----------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: express_delivery_api_prod
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://livraison:livraison@db:5432/livraison_express
      - ARTIFACTS_DIR=/app/artifacts
    volumes:
      - prod_model_artifacts:/app/artifacts:ro
    depends_on:
      db:
        condition: service_healthy
      trainer:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # 5. Apache Airflow Orchestrator (DAG scheduler + Web UI on port 8080)
  # ----------------------------------------------------------------------------
  airflow:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: express_delivery_airflow_prod
    command: ["standalone"]
    group_add:
      - "10001"
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://livraison:livraison@db:5432/livraison_express
      - ARTIFACTS_DIR=/app/artifacts
      - MLFLOW_TRACKING_URI=sqlite:////app/local_databases/mlflow.db
      - RETRAIN_MIN_NEW_ORDERS=300
      - RETRAIN_GROWTH_RATIO=0.05
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=false
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/data/airflow.db
      - AIRFLOW__WEBSERVER__SECRET_KEY=express-delivery-airflow-secret
      - _AIRFLOW_WWW_USER_USERNAME=admin
      - _AIRFLOW_WWW_USER_PASSWORD=admin
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - ./src:/opt/airflow/src:ro
      - prod_model_artifacts:/app/artifacts
      - prod_airflow_data:/opt/airflow/data
    depends_on:
      api:
        condition: service_healthy
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  prod_postgres_data:
  prod_model_artifacts:
  prod_airflow_data:
