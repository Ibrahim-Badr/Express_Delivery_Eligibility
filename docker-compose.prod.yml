services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL Production Database (24/7 Stateful ERP Store)
  # ----------------------------------------------------------------------------
  db:
    image: postgres:17-alpine
    container_name: express_delivery_db_prod
    environment:
      POSTGRES_DB: livraison_express
      POSTGRES_USER: livraison
      POSTGRES_PASSWORD: livraison
    ports:
      - "5432:5432"
    volumes:
      - prod_postgres_data:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U livraison -d livraison_express"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # 2. ERP Simulator Service (Continuously feeds live order batches)
  # ----------------------------------------------------------------------------
  erp-simulator:
    build:
      context: ./erp
      dockerfile: Dockerfile
    container_name: express_delivery_erp_prod
    environment:
      POSTGRES_DSN: postgresql://livraison:livraison@db:5432/livraison_express
      BATCH_SIZE: 5
      INTERVAL_SECONDS: 5
      POSTGRES_HISTORY_ORDERS: 10000
      RECENT_HISTORY_ORDERS: 1000
      LIVE_ORDER_LIMIT: 0
      LOG_LEVEL: INFO
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # 3. Initial Model Training Batch Job (Prepares initial model artifacts)
  # ----------------------------------------------------------------------------
  trainer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: express_delivery_trainer_prod
    command: ["python", "-m", "src.cli", "train"]
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://livraison:livraison@db:5432/livraison_express
      - ARTIFACTS_DIR=/app/artifacts
    volumes:
      - prod_model_artifacts:/app/artifacts
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    restart: "no"

  # ----------------------------------------------------------------------------
  # 4. FastAPI Serving Service (Stateless REST API for real-time predictions)
  # ----------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: express_delivery_api_prod
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://livraison:livraison@db:5432/livraison_express
      - ARTIFACTS_DIR=/app/artifacts
    volumes:
      - prod_model_artifacts:/app/artifacts:ro
    depends_on:
      db:
        condition: service_healthy
      trainer:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # 5. Model Retraining Orchestrator (Monitors new orders and retrains model)
  # ----------------------------------------------------------------------------
  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: express_delivery_orchestrator_prod
    command: ["python", "-m", "src.cli", "retrain-daemon", "--interval-seconds", "60", "--min-new-orders", "50"]
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://livraison:livraison@db:5432/livraison_express
      - ARTIFACTS_DIR=/app/artifacts
    volumes:
      - prod_model_artifacts:/app/artifacts
    depends_on:
      api:
        condition: service_healthy
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  prod_postgres_data:
  prod_model_artifacts:
