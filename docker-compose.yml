services:
  # ----------------------------------------------------------------------------
  # 1. Database Service (24/7 Stateful PostgreSQL)
  # ----------------------------------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: express_delivery_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: express_delivery
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d express_delivery"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # 2. ML Training Job Service (One-shot batch container that writes artifacts)
  # ----------------------------------------------------------------------------
  trainer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: express_delivery_trainer
    command: ["python", "-m", "src.cli", "train"]
    environment:
      - ENVIRONMENT=production
      - ARTIFACTS_DIR=/app/artifacts
    volumes:
      - model_artifacts:/app/artifacts
    security_opt:
      - no-new-privileges:true
    restart: "no"

  # ----------------------------------------------------------------------------
  # 3. FastAPI Serving Service (24/7 Stateless HTTP API)
  # ----------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: express_delivery_api
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - ARTIFACTS_DIR=/app/artifacts
      - DATABASE_URL=postgresql://user:password@db:5432/express_delivery
    volumes:
      - model_artifacts:/app/artifacts:ro
    depends_on:
      db:
        condition: service_healthy
      trainer:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  postgres_data:
  model_artifacts:
