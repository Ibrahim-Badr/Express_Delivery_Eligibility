version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/express_delivery
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./artifacts:/app/artifacts

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: express_delivery
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d express_delivery"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
